<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>okcourse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,0,600;9..144,1,300;9..144,1,400;9..144,1,600&family=Outfit:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="brand">
                <svg class="brand-icon" width="26" height="22" viewBox="0 0 26 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="0"  y="8"  width="3" height="6"  rx="1.5" fill="currentColor"/>
                    <rect x="5"  y="5"  width="3" height="12" rx="1.5" fill="currentColor"/>
                    <rect x="10" y="1"  width="3" height="20" rx="1.5" fill="currentColor"/>
                    <rect x="15" y="5"  width="3" height="12" rx="1.5" fill="currentColor"/>
                    <rect x="20" y="8"  width="3" height="6"  rx="1.5" fill="currentColor"/>
                </svg>
                <span class="brand-name">okcourse</span>
            </a>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                <span id="theme-icon">&#9790;</span>
            </button>
        </div>
    </header>

    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Built with <a href="https://github.com/mmacy/okcourse" target="_blank">okcourse</a> and OpenAI</p>
        </div>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
