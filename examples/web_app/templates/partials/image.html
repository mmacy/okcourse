<div data-tab-id="image" data-tab-label="Image">
    <h3>Cover image</h3>

    {% if course.generation_info.image_file_path %}
    <figure>
        <img src="/api/download/image" alt="Course cover image" style="max-width: 512px;">
        <figcaption>Generated in {{ "%.1f"|format(course.generation_info.image_gen_elapsed_seconds) }}s</figcaption>
    </figure>
    {% else %}
    <p class="secondary">No image was generated.</p>
    {% endif %}

    <div class="grid">
        <button hx-post="/htmx/generate/image"
                hx-target="#tab-image"
                hx-disabled-elt="this"
                class="secondary outline"
                data-loading-text="Regenerating image..."
                onclick="startProgress()">
            Regenerate image
        </button>

        {% if generate_audio %}
        <button hx-post="/htmx/generate/audio"
                hx-target="#tab-audio"
                hx-disabled-elt="this"
                data-loading-text="Generating audio..."
                onclick="startProgress()">
            Accept and generate audio
        </button>
        {% else %}
        <button hx-post="/htmx/summary"
                hx-target="#tab-summary">
            View summary
        </button>
        {% endif %}
    </div>
</div>
